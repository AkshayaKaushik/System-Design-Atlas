/* ---------- Build the tree ---------- */
const byId = new Map();
const root = { id: "atlas", kind: "root", name: "All domains", children: [], depth: 0 };
byId.set(root.id, root);
let leafTotal = 0;
DATA.forEach(d => {
  const dn = { id: "d-" + d.id, kind: "domain", name: d.n, blurb: d.b, hue: d.hue, icon: d.icon, res: d.r || [], parent: root, depth: 1, children: [] };
  root.children.push(dn); byId.set(dn.id, dn);
  d.g.forEach(g => {
    const gn = { id: "g-" + g.id, kind: "group", name: g.n, blurb: g.b, hue: d.hue, icon: d.icon, parent: dn, depth: 2, children: [] };
    dn.children.push(gn); byId.set(gn.id, gn);
    g.c.forEach(c => {
      const ln = { id: c.id, kind: "leaf", name: c.n, core: !!c.s, one: c.o, when: c.w, how: c.h, trade: c.t, res: c.r || [], wiki: c.k || null, hue: d.hue, parent: gn, depth: 3, children: [] };
      if (byId.has(ln.id)) console.warn("Duplicate id", ln.id);
      gn.children.push(ln); byId.set(ln.id, ln); leafTotal++;
    });
  });
});

/* ---------- State ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const learned = new Set(store.get("sda-learned-v1", []));
let coreOnly = !!store.get("sda-core-v1", false);
const activeIdx = new Map();
let currentId = null;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const isLeaf = n => n.kind === "leaf";
function leavesUnder(n) {
  if (isLeaf(n)) return [n];
  return n.children.reduce((a, c) => a.concat(leavesUnder(c)), []);
}
function visibleLeaves(n) { return leavesUnder(n).filter(l => !coreOnly || l.core); }
function visibleChildren(n) {
  if (n.kind === "group") return n.children.filter(l => !coreOnly || l.core);
  return n.children.filter(c => visibleLeaves(c).length > 0);
}
function pathOf(n) { const p = []; let x = n; while (x) { p.unshift(x); x = x.parent; } return p; }
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const domStyle = n => n.hue != null ? ' style="--h:' + n.hue + '"' : "";

/* ---------- Elements ---------- */
const $ = id => document.getElementById(id);
const view = $("view"), crumbs = $("crumbs"), backBtn = $("backBtn"), live = $("live");

/* ---------- Header bits ---------- */
function updateProgress() {
  const n = learned.size;
  $("progNum").textContent = n + " / " + leafTotal;
  $("progBar").style.width = (leafTotal ? (n / leafTotal * 100) : 0) + "%";
  $("brandSub").textContent = leafTotal + " concepts";
  $("footCount").textContent = leafTotal + " concepts · " + root.children.length + " domains";
  pal.input.placeholder = "Search " + leafTotal + " concepts, groups and domains";
}
function updateSeg() {
  $("segAll").setAttribute("aria-pressed", String(!coreOnly));
  $("segCore").setAttribute("aria-pressed", String(coreOnly));
}
function renderCrumbs(node) {
  const p = pathOf(node);
  crumbs.innerHTML = p.map((n, i) => {
    const last = i === p.length - 1;
    const label = n.kind === "root" ? "Atlas" : n.name;
    return (i ? '<span class="crumb-sep" aria-hidden="true">/</span>' : "") +
      '<button type="button" class="crumb" data-go="' + esc(n.id) + '"' + (last ? ' aria-current="page"' : "") + ">" + esc(label) + "</button>";
  }).join("");
  backBtn.disabled = !node.parent;
  backBtn.setAttribute("aria-label", node.parent ? "Back to " + (node.parent.kind === "root" ? "all domains" : node.parent.name) : "Back");
}

/* ---------- Navigation ---------- */
function go(id) {
  if (!byId.has(id)) id = "atlas";
  if (location.hash.slice(1) === id) { route(); return; }
  location.hash = id;
}
function route() {
  let id = decodeURIComponent(location.hash.slice(1));
  if (!byId.has(id)) id = "atlas";
  const node = byId.get(id);
  const prev = currentId ? byId.get(currentId) : null;
  if (prev && prev !== node) {
    // Coming back up: point the ring at the child we came from.
    let a = prev;
    while (a && a.parent && a.parent !== node) a = a.parent;
    if (a && a.parent === node) {
      const idx = visibleChildren(node).indexOf(a);
      if (idx >= 0) activeIdx.set(node.id, idx);
    }
  }
  const dir = !prev ? 0 : (node.depth > prev.depth ? 1 : node.depth < prev.depth ? -1 : 0);
  currentId = id;
  transition(dir, () => {
    renderCrumbs(node);
    if (isLeaf(node)) renderDetail(node); else renderTray(node);
    document.title = (node.kind === "root" ? "" : node.name + " · ") + "System Design Atlas";
  });
}
function transition(dir, build) {
  if (reduceMotion || dir === 0 && !view.childElementCount) { build(); return; }
  view.classList.remove("enter-in", "enter-out");
  view.classList.add(dir >= 0 ? "leave-in" : "leave-out");
  setTimeout(() => {
    view.classList.remove("leave-in", "leave-out");
    build();
    void view.offsetWidth;
    view.classList.add(dir >= 0 ? "enter-in" : "enter-out");
    window.scrollTo({ top: 0 });
  }, 190);
}

/* ---------- Tray (rotating shelf) ---------- */
let ringState = null;

/* Auto-rotate: a continuous clockwise spin (seen from above, cards drift left and new
   ones arrive from the right) whenever nobody is using the shelf. */
const AUTO_IDLE = 2500, AUTO_SPEED = 0.55; // idle ms before spinning; cards per second
const auto = { enabled: store.get("sda-auto-v1", !reduceMotion), lastInteract: 0, lastStep: 0, hover: false, drifting: false, lastT: 0 };
function stopDrift() {
  const s = ringState;
  if (!auto.drifting) return;
  auto.drifting = false;
  if (s) { s.ring.classList.remove("dragging"); s.active = Math.round(s.active); activeIdx.set(s.node.id, mod(s.active, s.kids.length)); layoutRing(); }
}
function touch() { auto.lastInteract = Date.now(); stopDrift(); }
function updateAutoBtn() {
  const b = $("autoBtn"); if (!b) return;
  b.setAttribute("aria-pressed", String(auto.enabled));
  b.innerHTML = auto.enabled
    ? '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>Pause rotation'
    : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>Auto-rotate';
  b.classList.toggle("is-on", auto.enabled);
}
function autoFrame(t) {
  const s = ringState;
  const dt = auto.lastT ? Math.min(0.05, (t - auto.lastT) / 1000) : 0;
  auto.lastT = t;
  const canSpin = s && s.ring.isConnected && auto.enabled && !auto.hover && !s.dragging && !document.hidden &&
    pal.wrap.hidden && Date.now() - auto.lastInteract >= AUTO_IDLE;
  if (canSpin) {
    if (!auto.drifting) { auto.drifting = true; s.ring.classList.add("dragging"); }
    s.active += AUTO_SPEED * dt;
    layoutRing();
  } else if (auto.drifting) {
    stopDrift();
  }
  requestAnimationFrame(autoFrame);
}
requestAnimationFrame(autoFrame);

function cardHTML(n, i) {
  if (isLeaf(n)) {
    const isL = learned.has(n.id);
    return '<button type="button" class="card dom" data-i="' + i + '"' + domStyle(n) + ' aria-label="' + esc(n.name + (n.core ? ", core concept" : "") + (isL ? ", learned" : "")) + '">' +
      '<div class="card-top">' + (n.core ? '<span class="chip star">★ Core</span>' : '<span class="kicker">Concept</span>') +
      (isL ? '<span class="chip learned">' + CHECK + 'Learned</span>' : "") + "</div>" +
      '<h3 class="card-title">' + esc(n.name) + "</h3>" +
      '<p class="card-blurb">' + esc(n.one) + "</p>" +
      '<div class="card-foot"><div class="card-when"><span class="label">Say it when</span><p>' + esc(n.when) + "</p></div>" +
      '<div class="card-cta"><span>Open concept</span><span aria-hidden="true">→</span></div></div></button>';
  }
  const leaves = visibleLeaves(n), all = leaves.length;
  const core = leaves.filter(l => l.core).length;
  const done = leaves.filter(l => learned.has(l.id)).length;
  const kids = visibleChildren(n).length;
  const kidWord = n.kind === "domain" ? (kids === 1 ? "group" : "groups") : (kids === 1 ? "concept" : "concepts");
  const meta = n.kind === "domain"
    ? kids + " " + kidWord + " · " + all + " concepts" + (coreOnly ? "" : " · " + core + " core")
    : kids + " " + kidWord + (coreOnly ? "" : " · " + core + " core");
  return '<button type="button" class="card dom" data-i="' + i + '"' + domStyle(n) + ' aria-label="' + esc(n.name + ", " + meta) + '">' +
    '<div class="card-top"><span class="tile">' + svg(n.icon) + '</span><span class="kicker">' + (n.kind === "domain" ? "Domain" : "Group") + "</span></div>" +
    '<h3 class="card-title">' + esc(n.name) + "</h3>" +
    '<p class="card-blurb">' + esc(n.blurb || "") + "</p>" +
    '<div class="card-foot"><div class="card-meta">' + esc(meta) + "</div>" +
    '<div class="bar" aria-hidden="true"><i style="width:' + (all ? done / all * 100 : 0) + '%"></i></div>' +
    '<div class="card-cta"><span>' + done + " of " + all + ' learned</span><span aria-hidden="true">Open →</span></div></div></button>';
}

function renderTray(node) {
  const kids = visibleChildren(node);
  const leaves = visibleLeaves(node);
  const learnedHere = leaves.filter(l => learned.has(l.id)).length;
  const eyebrow = node.kind === "root" ? "System design vocabulary" : node.kind === "domain" ? "Domain" : "Group · " + node.parent.name;
  const childWord = node.kind === "group" ? "Concepts" : node.kind === "domain" ? "Groups" : "Domains";
  const blurb = node.kind === "root"
    ? "The most-used system design concepts and patterns, grouped by what they’re about. Pick a domain, drill into a group, then open a concept to learn it."
    : node.blurb;

  let html = '<section class="dom"' + domStyle(node) + ">" +
    '<div class="level-head"><div><div class="eyebrow">' + esc(eyebrow) + '</div><h1 class="level-title">' + esc(node.kind === "root" ? "System Design Atlas" : node.name) + "</h1>" +
    '<p class="level-blurb">' + esc(blurb) + "</p></div>" +
    '<div class="level-stats"><div class="stat"><b>' + kids.length + "</b><span>" + childWord + '</span></div><div class="stat"><b>' + leaves.length + '</b><span>Concepts</span></div><div class="stat"><b>' + learnedHere + "</b><span>Learned</span></div></div></div>";

  if (!kids.length) {
    html += '<div class="empty"><p>No core concepts in this group.</p><button type="button" class="back-btn" id="showAll">Show all concepts</button></div></section>';
    view.innerHTML = html;
    const b = $("showAll"); if (b) b.addEventListener("click", () => setCore(false));
    ringState = null;
    return;
  }

  html += '<div class="stage" id="stage" role="region" aria-roledescription="carousel" aria-label="' + esc(childWord) + '">' +
    '<div class="ring" id="ring">' + kids.map(cardHTML).join("") + "</div>" +
    '<button type="button" class="nav-arrow prev" id="prevBtn" aria-label="Previous card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>' +
    '<button type="button" class="nav-arrow next" id="nextBtn" aria-label="Next card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>' +
    "</div>" +
    '<div class="ring-index"><div class="ticks" id="ticks">' + kids.map((k, i) => '<button type="button" class="tick dom" data-t="' + i + '"' + domStyle(k) + ' aria-label="Show ' + esc(k.name) + '"></button>').join("") + "</div>" +
    '<div class="ring-row"><div class="ring-caption" id="ringCaption"></div>' +
    '<button type="button" class="auto-btn" id="autoBtn" aria-pressed="false"></button></div>' +
    '<div class="hint"><span><span class="kbd">←</span><span class="kbd">→</span>rotate</span><span><span class="kbd">Enter</span>open</span><span><span class="kbd">Esc</span>back</span><span>or drag the shelf</span></div></div></section>';
  view.innerHTML = html;

  const start = Math.min(activeIdx.get(node.id) || 0, kids.length - 1);
  ringState = { node, kids, active: start, drag: 0, wrap: kids.length >= 2, dragging: false, cards: Array.from(view.querySelectorAll(".card")), stage: $("stage"), ring: $("ring") };
  auto.lastInteract = Date.now(); auto.lastStep = Date.now(); auto.hover = false; auto.drifting = false;
  updateAutoBtn();
  layoutRing();
  wireRing();
}

function ringGeometry() {
  const st = ringState.stage;
  const w = st.clientWidth;
  const cw = parseFloat(getComputedStyle(st).getPropertyValue("--cw")) || 252;
  const R = Math.max(cw * 1.9, Math.min(cw * 2.4, w * 0.55));
  return { R, step: 31, cw };
}

const mod = (a, n) => ((a % n) + n) % n;
// Offset of card i from the front, taking the shortest way round when the shelf loops.
function ringOffset(s, i, pos) {
  const n = s.kids.length;
  let off = i - pos;
  // With two cards, keep the other card on the right so rotation always runs clockwise.
  if (s.wrap) off = n === 2 ? mod(off + 0.5, 2) - 0.5 : mod(off + n / 2, n) - n / 2;
  return off;
}
function frontIndex(s) {
  const n = s.kids.length, p = Math.round(s.active - s.drag);
  return s.wrap ? mod(p, n) : Math.max(0, Math.min(n - 1, p));
}

function layoutRing() {
  const s = ringState; if (!s) return;
  const { R, step } = ringGeometry();
  const pos = s.active - s.drag;
  s.ring.style.transform = "translateZ(" + (-R) + "px)";
  const n = s.kids.length;
  const dpos = s._lastPos === undefined ? 0 : pos - s._lastPos;
  s._lastPos = pos;
  s.cards.forEach((el, i) => {
    const off = ringOffset(s, i, pos);
    const ab = Math.abs(off);
    const hidden = ab > 2.6;
    // A card that wraps from one end of the shelf to the other would sweep across the
    // front. Detect that (it moved differently from the shelf), hide it, move it, then
    // let it fade in at its new place.
    const jumped = el._off !== undefined && Math.abs((off - el._off) + dpos) > 0.5;
    el._off = off;
    if (jumped) {
      el.style.transition = "none";
      el.style.opacity = "0";
      el.style.transform = "translate(-50%, -50%) rotateY(" + (off * step) + "deg) translateZ(" + R + "px)";
      void el.offsetWidth;
      el.style.transition = "";
    }
    el.style.transform = "translate(-50%, -50%) rotateY(" + (off * step) + "deg) translateZ(" + R + "px)";
    // On a looping shelf, fade cards out as they near the wrap point so nothing pops.
    let edge = 1;
    if (s.wrap) {
      const lo = n === 2 ? -0.5 : -n / 2, hi = lo + n;
      edge = Math.max(0, Math.min(1, Math.min(off - lo, hi - off) / 0.5));
    }
    el.style.opacity = hidden ? "0" : String(Math.max(0, 1 - ab * 0.27) * edge);
    el.style.zIndex = String(100 - Math.round(ab * 10));
    el.style.pointerEvents = hidden ? "none" : "auto";
    const front = ab < 0.5;
    el.classList.toggle("is-front", front);
    el.tabIndex = front ? 0 : -1;
    el.setAttribute("aria-hidden", hidden ? "true" : "false");
  });
  const a = frontIndex(s);
  view.querySelectorAll(".tick").forEach((t, i) => t.setAttribute("aria-current", i === a ? "true" : "false"));
  const k = s.kids[a];
  $("ringCaption").innerHTML = '<span class="pos">' + (a + 1) + " / " + s.kids.length + "</span><b>" + esc(k.name) + "</b>";
  $("prevBtn").disabled = !s.wrap && a <= 0;
  $("nextBtn").disabled = !s.wrap && a >= s.kids.length - 1;
}

// i is an absolute ring position; on a looping shelf it may run past either end.
function setActive(i, announce) {
  const s = ringState; if (!s) return;
  const n = s.kids.length;
  if (!s.wrap) i = Math.max(0, Math.min(n - 1, i));
  s.active = i; s.drag = 0;
  const idx = mod(i, n);
  activeIdx.set(s.node.id, idx);
  layoutRing();
  if (announce) live.textContent = "Card " + (idx + 1) + " of " + n + ": " + s.kids[idx].name;
}
// Rotate the shortest way to card index i.
function rotateTo(i, announce) {
  const s = ringState; if (!s) return;
  const n = s.kids.length, cur = mod(s.active, n);
  let d = i - cur;
  if (s.wrap) d = mod(d + n / 2, n) - n / 2;
  setActive(s.active + d, announce);
}

function openIndex(i) {
  const s = ringState; if (!s) return;
  touch();
  const target = s.kids[i];
  if (i !== mod(s.active, s.kids.length)) {
    rotateTo(i);
    setTimeout(() => go(target.id), reduceMotion ? 0 : 380);
  } else {
    go(target.id);
  }
}

function wireRing() {
  const s = ringState;
  $("prevBtn").addEventListener("click", () => { touch(); setActive(s.active - 1, true); });
  $("nextBtn").addEventListener("click", () => { touch(); setActive(s.active + 1, true); });
  view.querySelectorAll(".tick").forEach(t => t.addEventListener("click", () => { touch(); rotateTo(+t.dataset.t, true); }));
  $("autoBtn").addEventListener("click", () => {
    auto.enabled = !auto.enabled; store.set("sda-auto-v1", auto.enabled);
    auto.lastInteract = Date.now() - AUTO_IDLE + 1200; auto.lastStep = 0;
    updateAutoBtn();
    live.textContent = auto.enabled ? "Auto-rotate on" : "Auto-rotate paused";
  });
  // Only real mouse movement over the shelf counts as activity; a resting cursor
  // doesn't stop the spin.
  let lastMX = null, lastMY = null;
  s.stage.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    if (lastMX !== null && (Math.abs(e.clientX - lastMX) > 2 || Math.abs(e.clientY - lastMY) > 2)) touch();
    lastMX = e.clientX; lastMY = e.clientY;
  });
  s.cards.forEach(el => {
    el.addEventListener("focus", () => { if (el.matches(":focus-visible")) touch(); });
  });

  let startX = 0, startY = 0, moved = false, down = false, pid = null;
  const { cw } = ringGeometry();
  const perCard = Math.max(110, cw * 0.75);
  s.stage.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".nav-arrow")) return;
    touch();
    down = true; moved = false; startX = e.clientX; startY = e.clientY; pid = e.pointerId;
  });
  s.stage.addEventListener("pointermove", e => {
    if (!down || e.pointerId !== pid) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {
      moved = true; s.dragging = true; touch(); s.ring.classList.add("dragging");
      try { s.stage.setPointerCapture(pid); } catch (err) {}
    }
    if (moved) {
      // Clamp so the shelf can only overshoot either end by a little.
      s.drag = s.wrap ? dx / perCard : Math.max(s.active - (s.kids.length - 1) - 0.4, Math.min(s.active + 0.4, dx / perCard));
      layoutRing();
    }
  });
  const end = e => {
    if (!down) return;
    down = false;
    if (moved) {
      s.dragging = false; touch();
      s.ring.classList.remove("dragging");
      const target = Math.round(s.active - s.drag);
      setActive(target, true);
      try { s.stage.releasePointerCapture(pid); } catch (err) {}
    }
  };
  s.stage.addEventListener("pointerup", end);
  s.stage.addEventListener("pointercancel", e => { if (moved) { s.dragging = false; s.ring.classList.remove("dragging"); s.drag = 0; layoutRing(); } down = false; });

  s.cards.forEach(el => el.addEventListener("click", e => {
    if (moved) { e.preventDefault(); moved = false; return; }
    openIndex(+el.dataset.i);
  }));

  let wheelLock = 0;
  s.stage.addEventListener("wheel", e => {
    if (Math.abs(e.deltaX) < Math.abs(e.deltaY) || Math.abs(e.deltaX) < 12) return;
    e.preventDefault();
    const now = Date.now();
    if (now - wheelLock < 320) return;
    wheelLock = now;
    touch();
    setActive(s.active + (e.deltaX > 0 ? 1 : -1), true);
  }, { passive: false });
}

/* ---------- Detail page ---------- */
function resourceRows(list) {
  return list.map(r => {
    const t = r[0], label = { v: "Video", a: "Article", d: "Docs", p: "Paper", i: "Interactive", s: "Search" }[t] || "Link";
    let host = ""; try { host = new URL(r[2]).hostname.replace(/^www\./, ""); } catch (e) {}
    return '<li><a class="res" href="' + esc(r[2]) + '" target="_blank" rel="noopener noreferrer"><span class="res-type t-' + t + '">' + label + '</span><span class="res-body"><span class="res-title">' + esc(r[1]) + '</span><span class="res-host">' + esc(host) + "</span></span>" + ARROW_OUT + "</a></li>";
  }).join("");
}

function renderDetail(n) {
  ringState = null;
  const group = n.parent, domain = group.parent;
  const sibs = visibleChildren(group).length ? visibleChildren(group) : group.children;
  let idx = sibs.indexOf(n);
  const all = group.children;
  const prevN = idx > 0 ? sibs[idx - 1] : null;
  const nextN = idx >= 0 && idx < sibs.length - 1 ? sibs[idx + 1] : null;
  const related = all.filter(x => x !== n);
  const isL = learned.has(n.id);

  const searchLinks = [["s", "YouTube: “" + n.name + " system design”", "https://www.youtube.com/results?search_query=" + encodeURIComponent(n.name + " system design explained")]];
  if (n.wiki) searchLinks.push(["s", "Wikipedia: " + n.wiki, "https://en.wikipedia.org/w/index.php?title=Special:Search&go=Go&search=" + encodeURIComponent(n.wiki)]);

  view.innerHTML =
    '<article class="detail dom"' + domStyle(n) + ">" +
      '<div class="detail-main">' +
        '<div class="eyebrow">' + esc(domain.name + " · " + group.name) + "</div>" +
        '<h1 class="detail-title">' + esc(n.name) + "</h1>" +
        '<div class="detail-chips">' + (n.core ? '<span class="chip star">★ Core concept</span>' : '<span class="chip dom-chip">Good to know</span>') +
          (isL ? '<span class="chip learned">' + CHECK + "Learned</span>" : "") + "</div>" +
        '<p class="lead" style="margin-top:18px">' + esc(n.one) + "</p>" +
        '<div class="callout"><span class="label">Say it when</span><p>' + esc(n.when) + "</p></div>" +
        '<div class="section"><h2>How it works</h2><p>' + esc(n.how) + "</p></div>" +
        '<div class="section"><h2>Trade-off</h2><p>' + esc(n.trade) + "</p></div>" +
        (related.length ? '<div class="section"><h2>Related in ' + esc(group.name) + '</h2><div class="related">' +
          related.map(r => '<button type="button" class="rel" data-go="' + esc(r.id) + '">' + (r.core ? '<span class="dot" aria-hidden="true"></span>' : "") + esc(r.name) + "</button>").join("") + "</div></div>" : "") +
        '<div class="pager">' +
          '<button type="button" class="prev" ' + (prevN ? 'data-go="' + esc(prevN.id) + '"' : "disabled") + '><span class="label">← Previous</span><span class="name">' + esc(prevN ? prevN.name : "Start of group") + "</span></button>" +
          '<button type="button" class="next" ' + (nextN ? 'data-go="' + esc(nextN.id) + '"' : "disabled") + '><span class="label">Next →</span><span class="name">' + esc(nextN ? nextN.name : "End of group") + "</span></button>" +
        "</div>" +
      "</div>" +
      '<aside class="aside">' +
        '<div class="panel"><h3>Your progress</h3><p class="sub">Mark it once you can explain it out loud without notes.</p>' +
          '<button type="button" class="learn-btn" id="learnBtn" aria-pressed="' + isL + '">' + (isL ? CHECK + "Learned" : "Mark as learned") + "</button></div>" +
        '<div class="panel"><h3>Learn more</h3><p class="sub">Videos, articles and docs, opened in a new tab.</p>' +
          (n.res.length ? '<div class="res-group">For this concept</div><ul class="res-list">' + resourceRows(n.res) + "</ul>" : "") +
          '<div class="res-group">Search</div><ul class="res-list">' + resourceRows(searchLinks) + "</ul>" +
          '<div class="res-group">Go deeper on ' + esc(domain.name) + '</div><ul class="res-list">' + resourceRows(domain.res) + "</ul>" +
        "</div>" +
      "</aside>" +
    "</article>";

  $("learnBtn").addEventListener("click", () => {
    if (learned.has(n.id)) learned.delete(n.id); else learned.add(n.id);
    store.set("sda-learned-v1", Array.from(learned));
    updateProgress();
    const nowL = learned.has(n.id);
    const b = $("learnBtn");
    b.setAttribute("aria-pressed", String(nowL));
    b.innerHTML = nowL ? CHECK + "Learned" : "Mark as learned";
    const chips = view.querySelector(".detail-chips");
    chips.innerHTML = (n.core ? '<span class="chip star">★ Core concept</span>' : '<span class="chip dom-chip">Good to know</span>') + (nowL ? '<span class="chip learned">' + CHECK + "Learned</span>" : "");
    live.textContent = nowL ? n.name + " marked as learned" : n.name + " unmarked";
  });
}

/* ---------- Search palette ---------- */
const pal = { wrap: $("paletteWrap"), input: $("paletteInput"), list: $("paletteList"), items: [], sel: 0, lastFocus: null };
const searchIndex = Array.from(byId.values()).filter(n => n.kind !== "root").map(n => ({
  n, hay: (n.name + " " + (n.one || n.blurb || "") + " " + (n.when || "")).toLowerCase(),
  name: n.name.toLowerCase(),
  path: pathOf(n).slice(1, -1).map(x => x.name).join(" › ")
}));
function openPalette() {
  pal.lastFocus = document.activeElement;
  pal.wrap.hidden = false;
  pal.input.value = "";
  filterPalette();
  setTimeout(() => pal.input.focus(), 0);
}
function closePalette() {
  pal.wrap.hidden = true;
  if (pal.lastFocus && pal.lastFocus.focus) pal.lastFocus.focus();
}
function filterPalette() {
  const q = pal.input.value.trim().toLowerCase();
  let res;
  if (!q) {
    res = searchIndex.filter(x => x.n.kind === "leaf" && x.n.core).slice(0, 12);
  } else {
    const toks = q.split(/\s+/);
    res = searchIndex.filter(x => toks.every(t => x.hay.includes(t)))
      .map(x => ({ x, score: (x.name.startsWith(q) ? 0 : x.name.includes(q) ? 1 : 2) + (x.n.kind === "leaf" ? 0 : 0.5) }))
      .sort((a, b) => a.score - b.score || a.x.n.name.localeCompare(b.x.n.name))
      .slice(0, 40).map(o => o.x);
  }
  pal.items = res; pal.sel = 0;
  if (!res.length) {
    pal.list.innerHTML = '<li class="p-empty">No concepts match “' + esc(pal.input.value) + "”.</li>";
    return;
  }
  pal.list.innerHTML = (q ? "" : '<li class="res-group" role="presentation">Core concepts</li>') + res.map((x, i) =>
    '<li class="p-item dom" role="option" id="opt-' + i + '" data-k="' + i + '" aria-selected="' + (i === 0) + '"' + domStyle(x.n) + '>' +
    '<span class="p-dot" aria-hidden="true"></span><span style="min-width:0"><span class="p-name">' + (x.n.core ? "★ " : "") + esc(x.n.name) + '</span><span class="p-path">' + esc(x.path || "Domain") + "</span></span>" +
    '<span class="p-kind">' + (x.n.kind === "leaf" ? "Concept" : x.n.kind === "group" ? "Group" : "Domain") + "</span></li>").join("");
  pal.input.setAttribute("aria-activedescendant", "opt-0");
}
function movePalette(d) {
  if (!pal.items.length) return;
  pal.sel = (pal.sel + d + pal.items.length) % pal.items.length;
  pal.list.querySelectorAll(".p-item").forEach((el, i) => el.setAttribute("aria-selected", String(i === pal.sel)));
  const el = $("opt-" + pal.sel); if (el) el.scrollIntoView({ block: "nearest" });
  pal.input.setAttribute("aria-activedescendant", "opt-" + pal.sel);
}
function pickPalette(i) {
  const x = pal.items[i]; if (!x) return;
  pal.wrap.hidden = true;
  go(x.n.id);
  setTimeout(() => view.focus({ preventScroll: true }), 450);
}
pal.input.addEventListener("input", filterPalette);
pal.input.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); movePalette(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); movePalette(-1); }
  else if (e.key === "Enter") { e.preventDefault(); pickPalette(pal.sel); }
  else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
});
pal.list.addEventListener("click", e => { const it = e.target.closest(".p-item"); if (it) pickPalette(+it.dataset.k); });
pal.wrap.addEventListener("click", e => { if (e.target === pal.wrap) closePalette(); });

/* ---------- Global wiring ---------- */
function setCore(v) {
  coreOnly = v; store.set("sda-core-v1", v); updateSeg();
  activeIdx.clear();
  const node = byId.get(currentId) || root;
  renderCrumbs(node);
  if (isLeaf(node)) renderDetail(node); else renderTray(node);
}
$("segAll").addEventListener("click", () => setCore(false));
$("segCore").addEventListener("click", () => setCore(true));
$("brand").addEventListener("click", () => go("atlas"));
$("searchBtn").addEventListener("click", openPalette);
backBtn.addEventListener("click", () => { const n = byId.get(currentId); if (n && n.parent) go(n.parent.id); });
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled && !g.matches('[aria-current="page"]')) go(g.dataset.go);
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || "")) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); pal.wrap.hidden ? openPalette() : closePalette(); return; }
  if (!pal.wrap.hidden || typing) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); return; }
  const n = byId.get(currentId);
  if (e.key === "Escape" || e.key === "Backspace") { if (n && n.parent) { e.preventDefault(); go(n.parent.id); } return; }
  if (ringState && !isLeaf(n)) {
    if (["ArrowRight", "ArrowLeft", "Home", "End"].includes(e.key)) touch();
    if (e.key === "ArrowRight") { e.preventDefault(); setActive(ringState.active + 1, true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); setActive(ringState.active - 1, true); }
    else if (e.key === "Home") { e.preventDefault(); rotateTo(0, true); }
    else if (e.key === "End") { e.preventDefault(); rotateTo(ringState.kids.length - 1, true); }
    else if (e.key === "Enter" && !(e.target.closest && e.target.closest("button"))) { e.preventDefault(); openIndex(mod(ringState.active, ringState.kids.length)); }
  }
});
let resizeT = 0;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(layoutRing, 80); });
window.addEventListener("hashchange", route);

updateProgress();
updateSeg();
route();
})();
</script>
