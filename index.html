<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive flashcards for 143 system design concepts and patterns, grouped by domain, with learning resources.">
<title>System Design Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky top bar, a breadcrumb toolbar, then one view at a time —
   either a 3D "hash ring" shelf of cards, or a concept detail page. */
:root {
  --bg: #F3F5F8;
  --bg-glow: rgba(53, 82, 214, .08);
  --surface: #FFFFFF;
  --surface-2: #F7F9FC;
  --ink: #0D1220;
  --ink-2: #485267;
  --ink-3: #7A8497;
  --line: #E0E5EC;
  --line-2: #CBD2DD;
  --accent: #3552D6;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(53, 82, 214, .10);
  --good: #12804A;
  --good-soft: rgba(18, 128, 74, .12);
  --star: #A86A12;
  --star-soft: rgba(168, 106, 18, .12);
  --scrim: rgba(13, 18, 32, .38);
  --shadow: 0 1px 2px rgba(13, 18, 32, .05), 0 14px 34px -16px rgba(13, 18, 32, .22);
  --shadow-front: 0 2px 6px rgba(13, 18, 32, .06), 0 34px 70px -28px rgba(30, 48, 140, .45);
  --floor: rgba(53, 82, 214, .13);
  --dom-s: 62%;
  --dom-l: 42%;
  --font-display: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, .8, .24, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090C11;
    --bg-glow: rgba(125, 152, 255, .10);
    --surface: #11161F;
    --surface-2: #161C27;
    --ink: #E8ECF3;
    --ink-2: #A6B0C0;
    --ink-3: #6F798B;
    --line: #1E2531;
    --line-2: #2B3443;
    --accent: #84A0FF;
    --accent-ink: #0A0D12;
    --accent-soft: rgba(132, 160, 255, .14);
    --good: #3FCF88;
    --good-soft: rgba(63, 207, 136, .14);
    --star: #F2B648;
    --star-soft: rgba(242, 182, 72, .14);
    --scrim: rgba(3, 5, 9, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -18px rgba(0, 0, 0, .7);
    --shadow-front: 0 2px 6px rgba(0, 0, 0, .4), 0 40px 80px -30px rgba(70, 100, 255, .38);
    --floor: rgba(132, 160, 255, .14);
    --dom-s: 80%;
    --dom-l: 70%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090C11;
  --bg-glow: rgba(125, 152, 255, .10);
  --surface: #11161F;
  --surface-2: #161C27;
  --ink: #E8ECF3;
  --ink-2: #A6B0C0;
  --ink-3: #6F798B;
  --line: #1E2531;
  --line-2: #2B3443;
  --accent: #84A0FF;
  --accent-ink: #0A0D12;
  --accent-soft: rgba(132, 160, 255, .14);
  --good: #3FCF88;
  --good-soft: rgba(63, 207, 136, .14);
  --star: #F2B648;
  --star-soft: rgba(242, 182, 72, .14);
  --scrim: rgba(3, 5, 9, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -18px rgba(0, 0, 0, .7);
  --shadow-front: 0 2px 6px rgba(0, 0, 0, .4), 0 40px 80px -30px rgba(70, 100, 255, .38);
  --floor: rgba(132, 160, 255, .14);
  --dom-s: 80%;
  --dom-l: 70%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(1100px 520px at 50% -12%, var(--bg-glow), transparent 62%), var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.dom { --c: hsl(var(--h) var(--dom-s) var(--dom-l)); --c-soft: hsl(var(--h) var(--dom-s) var(--dom-l) / .12); --c-line: hsl(var(--h) var(--dom-s) var(--dom-l) / .45); }

.shell { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100%; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding-block: 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink); background: none; border: 0; cursor: pointer; padding: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 650; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.brand-sub { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.topbar-spacer { flex: 1; }
.search-btn {
  display: flex; align-items: center; gap: 10px;
  height: 38px; padding: 0 10px 0 12px; min-width: 0;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  color: var(--ink-3); cursor: pointer; width: 280px; max-width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
.search-btn:hover { border-color: var(--line-2); }
.search-btn svg { width: 16px; height: 16px; flex: none; }
.search-btn span { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.kbd { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; background: var(--surface-2); }
.progress-pill { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); white-space: nowrap; }
.progress-pill .num { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink); }
.progress-pill .lbl { font-size: 12.5px; color: var(--ink-3); }
.mini-bar { width: 64px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--good); border-radius: 4px; transition: width .4s var(--ease); }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 12px; padding-block: 14px 4px; flex-wrap: wrap; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 8px;
  border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-size: 13.5px; font-weight: 500; color: var(--ink);
  transition: border-color .15s, background .15s, opacity .15s;
}
.back-btn:hover:not(:disabled) { border-color: var(--line-2); background: var(--surface-2); }
.back-btn:disabled { opacity: .45; cursor: default; }
.back-btn svg { width: 18px; height: 18px; }
.crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; flex: 1; font-size: 13.5px; }
.crumb { background: none; border: 0; padding: 4px 6px; border-radius: 6px; color: var(--ink-3); cursor: pointer; white-space: nowrap; }
.crumb:hover { color: var(--ink); background: var(--accent-soft); }
.crumb[aria-current="page"] { color: var(--ink); font-weight: 500; cursor: default; background: none; }
.crumb-sep { color: var(--line-2); font-size: 12px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--ink-3); cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.seg .star-ic { color: var(--star); }

/* Views and transitions */
.view { flex: 1; padding-block: 8px 40px; }
.view.leave-in { animation: leaveIn .2s ease forwards; }
.view.leave-out { animation: leaveOut .2s ease forwards; }
.view.enter-in { animation: enterIn .42s var(--ease); }
.view.enter-out { animation: enterOut .42s var(--ease); }
@keyframes leaveIn { to { opacity: 0; transform: scale(.955); } }
@keyframes leaveOut { to { opacity: 0; transform: scale(1.025); } }
@keyframes enterIn { from { opacity: 0; transform: scale(1.035) translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes enterOut { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

/* Level header */
.level-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-block: 18px 6px; flex-wrap: wrap; }
.level-head > div { min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--c, var(--accent)); }
.level-title { font-family: var(--font-display); font-weight: 650; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 8px; text-wrap: balance; }
.level-blurb { color: var(--ink-2); max-width: 62ch; margin: 0; }
.level-stats { display: flex; gap: 22px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }

/* Stage: rotating shelf */
.stage {
  --cw: 252px; --ch: 340px;
  position: relative; height: 470px; margin-top: 8px;
  perspective: 1700px; perspective-origin: 50% 38%;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
  overflow: hidden;
}
.stage::after {
  content: ""; position: absolute; left: 50%; bottom: 26px; width: min(900px, 96%); height: 90px;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, var(--floor), transparent);
  pointer-events: none;
}
.ring { position: absolute; inset: 0; transform-style: preserve-3d; }
.ring.dragging .card { transition: none; }
.card {
  position: absolute; left: 50%; top: 46%;
  width: var(--cw); height: var(--ch);
  margin: 0; padding: 20px;
  display: flex; flex-direction: column; gap: 12px; text-align: left;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .72s var(--ease), opacity .5s ease, border-color .3s, box-shadow .3s;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  will-change: transform;
}
.card.is-front { border-color: var(--c-line); box-shadow: var(--shadow-front); }
.card:hover { border-color: var(--c-line); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px; }
.tile { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--c-soft); color: var(--c); }
.tile svg { width: 22px; height: 22px; }
.kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.card-title { font-family: var(--font-display); font-weight: 650; font-size: 22px; line-height: 1.15; letter-spacing: -.015em; margin: 4px 0 0; text-wrap: balance; }
.card-blurb { margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; flex: 0 1 auto; min-height: 0; }
.card > * { flex-shrink: 0; }
.card > .card-blurb { flex-shrink: 1; }
.card-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.card-meta { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.card-cta { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); }
.card.is-front .card-cta { color: var(--c); font-weight: 500; }
.card-when { border-top: 1px dashed var(--line-2); padding-top: 10px; }
.card-when .label, .label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.card-when p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.star { background: var(--star-soft); color: var(--star); }
.chip.learned { background: var(--good-soft); color: var(--good); }
.chip.dom-chip { background: var(--c-soft); color: var(--c); }
.chip svg { width: 13px; height: 13px; }

.nav-arrow {
  position: absolute; top: 46%; transform: translateY(-50%); z-index: 200;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  box-shadow: var(--shadow); transition: border-color .15s, opacity .15s;
}
.nav-arrow:hover:not(:disabled) { border-color: var(--line-2); }
.nav-arrow:disabled { opacity: .35; cursor: default; }
.nav-arrow svg { width: 20px; height: 20px; }
.nav-arrow.prev { left: 4px; }
.nav-arrow.next { right: 4px; }

.ring-index { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: -6px; }
.ticks { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.tick { width: 22px; height: 6px; border-radius: 6px; border: 0; padding: 0; background: var(--line-2); cursor: pointer; transition: background .25s, width .25s; }
.tick[aria-current="true"] { background: var(--c, var(--accent)); width: 34px; }
.ring-row { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.ring-caption { font-size: 13px; color: var(--ink-3); text-align: center; }
.auto-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px 0 9px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: 12.5px; color: var(--ink-2); cursor: pointer; transition: border-color .15s, color .15s;
}
.auto-btn:hover { border-color: var(--line-2); color: var(--ink); }
.auto-btn svg { width: 13px; height: 13px; }
.auto-btn.is-on svg { color: var(--c, var(--accent)); }
.ring-caption b { color: var(--ink); font-weight: 500; }
.ring-caption .pos { font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin-right: 8px; }
.hint { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.hint .kbd { margin-right: 4px; }
.empty { text-align: center; padding: 80px 16px; color: var(--ink-2); }
.empty button { margin-top: 12px; }

/* Detail page */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; padding-top: 18px; align-items: start; }
.detail-main { min-width: 0; }
.detail-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.detail-title { font-family: var(--font-display); font-weight: 650; font-size: clamp(32px, 5vw, 48px); line-height: 1.05; letter-spacing: -.025em; margin: 14px 0 14px; text-wrap: balance; }
.lead { font-size: 19px; line-height: 1.5; color: var(--ink); max-width: 60ch; margin: 0 0 24px; text-wrap: pretty; }
.callout { border: 1px solid var(--c-line); background: var(--c-soft); border-radius: 14px; padding: 16px 18px; max-width: 64ch; }
.callout .label { color: var(--c); }
.callout p { margin: 6px 0 0; font-size: 16px; color: var(--ink); }
.section { margin-top: 28px; max-width: 64ch; }
.section h2 { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: .01em; margin: 0 0 6px; color: var(--ink); }
.section p { margin: 0; color: var(--ink-2); font-size: 15.5px; }
.related { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.rel {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s, color .15s;
}
.rel:hover { border-color: var(--c-line); color: var(--ink); }
.rel .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--star); }
.pager { display: flex; gap: 12px; margin-top: 36px; max-width: 64ch; }
.pager button {
  flex: 1; min-width: 0; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: border-color .15s;
}
.pager button:hover:not(:disabled) { border-color: var(--line-2); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager .next { text-align: right; }
.pager .label { display: block; }
.pager .name { display: block; font-weight: 500; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

.aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: 16px; }
.panel { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.panel h3 { font-family: var(--font-display); font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.panel .sub { font-size: 12.5px; color: var(--ink-3); margin: 0 0 12px; }
.learn-btn {
  width: 100%; height: 42px; border-radius: 11px; cursor: pointer; font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  transition: filter .15s, background .15s, color .15s;
}
.learn-btn:hover { filter: brightness(1.06); }
.learn-btn[aria-pressed="true"] { background: var(--good-soft); color: var(--good); border-color: transparent; }
.learn-btn svg { width: 17px; height: 17px; }
.res-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.res {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px; text-decoration: none; color: var(--ink);
  transition: background .15s;
}
.res:hover { background: var(--surface-2); }
.res-type { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); min-width: 54px; text-align: center; }
.res-type.t-v { color: hsl(352 70% 50%); }
.res-type.t-s { color: var(--ink-3); }
.res-body { min-width: 0; }
.res-title { display: block; font-size: 13.5px; font-weight: 500; line-height: 1.35; }
.res-host { display: block; font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res svg { width: 14px; height: 14px; color: var(--ink-3); }
.res-group { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 12px 10px 4px; }
.note { font-size: 12px; color: var(--ink-3); margin: 10px 10px 0; }

/* Search palette */
.palette-wrap { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 10vh) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.palette { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-front); overflow: hidden; animation: pop .18s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.985); } }
.palette-input { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.palette-input svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.palette-input input { flex: 1; min-width: 0; height: 54px; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: var(--ink); }
.palette-list { max-height: min(56vh, 460px); overflow-y: auto; padding: 6px; margin: 0; list-style: none; }
.p-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.p-item[aria-selected="true"] { background: var(--accent-soft); }
.p-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.p-name { font-weight: 500; font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-path { font-size: 12px; color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-kind { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.p-empty { padding: 28px 16px; text-align: center; color: var(--ink-3); font-size: 14px; }
.palette-foot { display: flex; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }

.footer { border-top: 1px solid var(--line); padding-block: 16px 24px; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 860px) {
  .detail { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .aside { position: static; }
  .progress-pill .lbl, .mini-bar { display: none; }
  .search-btn { width: auto; flex: 1; }
  .topbar-spacer { display: none; }
}
@media (max-width: 560px) {
  .brand-sub, .search-btn .kbd, .search-btn span { display: none; }
  .search-btn { flex: none; width: 38px; padding: 0; justify-content: center; margin-left: auto; }
  .brand-name { font-size: 16px; }
  .stage { --cw: 228px; --ch: 336px; height: 430px; }

  .level-stats { gap: 16px; }
  .hint { display: none; }
  .nav-arrow { width: 38px; height: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .view, .palette, .tick, .mini-bar i { transition: none !important; animation: none !important; }

    { id: "stateless", n: "Stateless service", s: 1, k: "Stateless protocol", o: "A service that keeps no client data between requests, so any instance can handle any request.", w: "Justifying a load balancer and autoscaling.",
      h: "Session data moves to a shared store such as Redis or into a signed token. Instances can then be added, removed or replaced at any time.",
      t: "The shared state store becomes the thing to scale and protect." },
    { id: "read-write-heavy", n: "Read-heavy vs write-heavy", o: "Which side dominates the load.", w: "Choosing caching (read-heavy) or partitioning and queues (write-heavy).",
      h: "Read-heavy systems scale with caches, replicas and CDNs. Write-heavy systems scale with sharding, batching, queues and write-optimised storage.",
      t: "Optimising one side often costs the other: more indexes speed reads but slow writes." },
    { id: "estimation", n: "Back-of-envelope estimation", o: "Rough maths for QPS, storage and bandwidth from stated assumptions.", w: "The first five minutes of every design.",
      h: "Start from users and actions per day, divide by 86,400 seconds for average QPS, and multiply by a peak factor of 2–3×. Storage = items per day × size × retention.",
      t: "Precision doesn’t matter; the order of magnitude decides the design.", r: [L.latnum] },
    { id: "amdahl", n: "Amdahl’s law", k: "Amdahl's law", o: "Speed-up is limited by the part that can’t be parallelised.", w: "Explaining why adding workers stops helping.",
      h: "If 10% of a job is serial, the maximum speed-up is 10×, however many machines you add.",
      t: "Shrinking the serial part matters more than adding capacity." }
  ]}
  ]},

{ id: "networking", n: "Networking & APIs", hue: 195, icon: "network",
  b: "How clients reach services, how services talk to each other, and how traffic is spread.",
  r: [L.hn, L.bbg, L.primer],
  g: [
  { id: "net-foundations", n: "Network foundations", b: "What happens between typing a URL and the first byte.", c: [
    { id: "dns", n: "DNS", s: 1, k: "Domain Name System", o: "Turns a name into an IP address.", w: "Explaining how a client finds the service; geo-routing.",
      h: "The resolver asks a root server, then the top-level domain server (.com), then the domain’s authoritative server, caching each answer for its TTL. DNS can return different IPs per region.",
      t: "Long TTLs mean fewer lookups but slower failover to a new IP.", r: [L.cfDns, L.fccDns] },
    { id: "tcp-udp", n: "TCP vs UDP", s: 1, k: "Transmission Control Protocol", o: "TCP is reliable and ordered; UDP sends packets with no guarantees.", w: "Video, gaming or voice (UDP) vs almost everything else (TCP).",
      h: "TCP opens with a three-way handshake (SYN, SYN-ACK, ACK), numbers every byte and retransmits losses. UDP just sends datagrams; a lost packet is simply gone.",
      t: "TCP’s reliability adds latency; UDP is faster but the application must cope with loss.", r: [L.cfTcp] },
    { id: "tls", n: "TLS / HTTPS", s: 1, k: "Transport Layer Security", o: "Encryption plus proof of the server’s identity.", w: "Any public endpoint.",
      h: "In the handshake the server presents a certificate signed by a trusted authority, and both sides agree on session keys. Everything afterwards is encrypted.",
      t: "The handshake adds round trips; TLS 1.3 and session resumption reduce them.", r: [L.cfTls, L.httpsVid] },
    { id: "http23", n: "HTTP/2 and HTTP/3", k: "HTTP/3", o: "HTTP/2 sends many requests over one connection; HTTP/3 runs over QUIC on UDP.", w: "Reducing connection overhead and head-of-line blocking.",
      h: "HTTP/2 multiplexes streams over one TCP connection, but one lost packet stalls them all. HTTP/3 uses QUIC, where each stream recovers on its own and the handshake is faster.",
      t: "Some networks block UDP, so clients fall back to HTTP/2.", r: [L.cfHttp3] }
  ]},
  { id: "api-styles", n: "API styles", b: "How a client asks for something, and how to make asking twice safe.", c: [
    { id: "rest", n: "REST", s: 1, k: "REST", o: "Resource-based HTTP APIs: GET, POST, PUT, DELETE on URLs.", w: "Public and client-facing APIs.",
      h: "Each resource has a URL; HTTP methods express the action and status codes the result. Responses are usually JSON and can be cached by standard HTTP rules.",
      t: "Simple and universal, but clients may need several calls or get more data than they need." },
    { id: "grpc", n: "gRPC", s: 1, k: "gRPC", o: "Binary RPC over HTTP/2 with Protocol Buffers.", w: "Fast service-to-service calls.",
      h: "Services and messages are defined in a .proto file and client and server code is generated. Calls are compact, typed, and can stream in both directions.",
      t: "Fast and strongly typed, but harder to debug and less browser-friendly than REST.", r: [L.grpc] },
    { id: "graphql", n: "GraphQL", k: "GraphQL", o: "The client asks for exactly the fields it needs in one query.", w: "Mobile clients with varied data needs.",
      h: "A schema describes every type; the server resolves each requested field, often from several backends.",
      t: "Flexible for clients, but caching is harder and one expensive query can overload the server.", r: [L.gql] },
    { id: "idempotent", n: "Idempotent request", s: 1, k: "Idempotence", o: "Repeating it has the same effect as doing it once.", w: "Retries and payments.",
      h: "GET, PUT and DELETE are idempotent by definition. A POST becomes idempotent when the client sends a unique key and the server stores the first result for that key.",
      t: "The server must keep keys and results for a time window.", r: [L.mdnIdem, L.stripeIdem, L.awsIdem] },
    { id: "pagination", n: "Pagination (offset vs cursor)", o: "Offset: page 5 of 20. Cursor: items after this ID.", w: "Feeds and long lists.",
      h: "Offset pagination skips N rows, which gets slow and shows duplicates when data changes. A cursor encodes the last item seen, so the next query starts right after it using an index.",
      t: "Cursors are fast and stable but can’t jump to an arbitrary page." }
  ]},
  { id: "realtime", n: "Real-time communication", b: "Four ways to get updates to a client, from simplest to most capable.", c: [
    { id: "short-polling", n: "Short polling", k: "Polling (computer science)", o: "The client asks for updates every few seconds.", w: "Simple dashboards with low update rates.",
      h: "A timer sends a normal HTTP request again and again; most responses say nothing changed.",
      t: "Easy to build, but wastes requests and adds up to one interval of delay.", r: [L.rtVid] },
    { id: "long-polling", n: "Long polling", k: "Push technology", o: "The server holds the request open until there is new data.", w: "Near-real-time updates where WebSockets aren’t possible.",
      h: "The client sends a request; the server answers only when an event arrives or a timeout passes, and the client immediately asks again.",
      t: "Fewer empty responses than polling, but every update still costs a new request.", r: [L.rtVid] },
    { id: "sse", n: "Server-sent events", s: 1, k: "Server-sent events", o: "A one-way stream of events from server to client over HTTP.", w: "Live status, notifications, feeds.",
      h: "The client opens one long-lived HTTP response and the server writes events as they happen. Browsers reconnect automatically and resume from the last event ID.",
      t: "Server to client only; use WebSockets for two-way messaging.", r: [L.mdnSse, L.rtVid] },
    { id: "websockets", n: "WebSockets", s: 1, k: "WebSocket", o: "A persistent two-way channel between client and server.", w: "Chat, multiplayer games, collaborative editing.",
      h: "An HTTP request is upgraded to a WebSocket connection that stays open, and both sides can send messages at any time.",
      t: "Long-lived connections are harder to balance and scale; you must track which server holds which user.", r: [L.mdnWs, L.rtVid] }
  ]},
  { id: "traffic", n: "Traffic management", b: "The components that sit between clients and your services.", c: [
    { id: "load-balancer", n: "Load balancer (L4 vs L7)", s: 1, k: "Load balancing (computing)", o: "Spreads traffic across instances.", w: "Every horizontally scaled service.",
      h: "An L4 balancer routes on IP and port without reading the payload, so it is fast. An L7 balancer reads HTTP and can route by path or header, terminate TLS and retry.",
      t: "L7 is smarter but slower and more expensive per request.", r: [L.l4l7, L.igoLb, L.cfLb] },
    { id: "lb-algorithms", n: "Load-balancing algorithms", o: "Round robin, least connections, consistent hashing.", w: "Sticky routing or requests with uneven cost.",
      h: "Round robin rotates evenly; least connections favours idle servers; hashing on a key sends the same user or item to the same server.",
      t: "Hash-based routing keeps caches warm but can create hot servers.", r: [L.cfLb] },
    { id: "reverse-proxy", n: "Reverse proxy", s: 1, k: "Reverse proxy", o: "A server in front of your services: TLS termination, routing, compression.", w: "Nginx or Envoy in front of the app.",
      h: "Clients only talk to the proxy, which forwards to backends and can cache, compress and hide the internal structure.",
      t: "One more hop and component to run, though usually worth it.", r: [L.cfProxy] },
    { id: "api-gateway", n: "API gateway", s: 1, o: "One entry point for all clients: auth, rate limiting, routing to services.", w: "Microservice architectures.",
      h: "The gateway authenticates requests, applies limits, routes to the right service and can combine several calls into one response.",
      t: "It can become a bottleneck and a single point of failure, so run it replicated.", r: [L.msGateway, L.azGw] },
    { id: "cdn", n: "CDN", s: 1, k: "Content delivery network", o: "Caches content at edge locations near users.", w: "Images, video, static files, global users.",
      h: "Users are routed to the nearest edge server; on a miss it fetches from your origin and caches the response for its TTL.",
      t: "Great for static content; personalised content is harder to cache, and invalidations take time to spread.", r: [L.cfCdn] },
    { id: "service-discovery", n: "Service discovery", k: "Service discovery", o: "How services find each other’s current addresses.", w: "Microservices with autoscaling.",
      h: "Instances register in a registry (Consul, etcd, Kubernetes DNS) and report health; callers look up healthy addresses.",
      t: "The registry itself must be highly available." },
    { id: "service-mesh", n: "Service mesh", k: "Service mesh", o: "A sidecar proxy beside each service handles retries, mTLS and metrics.", w: "Many services with shared network concerns.",
      h: "Every service’s traffic passes through a local proxy such as Envoy, configured centrally by Istio or Linkerd.",
      t: "Consistent behaviour everywhere, at the cost of extra latency and operational complexity." }
  ]}
  ]},

{ id: "databases", n: "Databases & Storage", hue: 265, icon: "db",
  b: "Where data lives, how it stays correct under concurrency, and how it spreads across machines.",
  r: [L.arpit, L.luke, L.pgIso, L.primer],
  g: [
  { id: "data-models", n: "Data models", b: "Picking the right kind of store for the access pattern.", c: [
    { id: "sql-nosql", n: "SQL vs NoSQL", s: 1, k: "NoSQL", o: "Relational tables with joins and transactions vs key-value, document, wide-column or graph stores.", w: "Choosing the main database.",
      h: "SQL gives schemas, joins and ACID transactions. NoSQL stores trade some of that for easy horizontal scaling or flexible schemas, modelled around specific queries.",
      t: "Default to SQL unless scale or access patterns clearly need NoSQL." },
    { id: "normalisation", n: "Normalisation vs denormalisation", k: "Database normalization", o: "No duplicated data vs duplicated data for fast reads.", w: "Read-heavy designs and NoSQL modelling.",
      h: "Normalised data lives in one place and is joined at read time. Denormalised data copies fields into every record that needs them, so reads need no joins.",
      t: "Denormalising speeds reads, but every update must change all copies." },
    { id: "object-storage", n: "Object storage", s: 1, k: "Object storage", o: "Cheap, durable storage for large files (S3, GCS).", w: "Images, videos, backups, logs.",
      h: "Files are stored as objects under keys with metadata and replicated for durability; the database keeps only the key.",
      t: "Very cheap and durable, but slower than local disk and no in-place partial updates." },
    { id: "time-series", n: "Time-series database", k: "Time series database", o: "Optimised for timestamped metrics.", w: "Monitoring, IoT, prices.",
      h: "Data is stored in time order with heavy compression and automatic downsampling of old data.",
      t: "Excellent for append-and-aggregate, poor for general queries." },
    { id: "inverted-index", n: "Inverted index", k: "Inverted index", o: "A map from each word to the documents containing it.", w: "Text search.",
      h: "Documents are split into terms; each term points to a list of document IDs, ranked by relevance (Elasticsearch, Lucene).",
      t: "Fast search, but the index lags behind writes and must be synced from the main database." },
    { id: "oltp-olap", n: "OLTP vs OLAP", k: "Online analytical processing", o: "Fast day-to-day transactions vs analytics over large history.", w: "Keeping reporting off the main database.",
      h: "OLTP databases are row-oriented for small reads and writes. OLAP warehouses are column-oriented to scan and aggregate billions of rows; data flows in through ETL or CDC.",
      t: "Two systems to keep in sync, but neither workload slows the other." }
  ]},
  { id: "transactions", n: "Transactions & concurrency", b: "Keeping data correct when many requests change it at once.", c: [
    { id: "acid", n: "ACID", s: 1, k: "ACID", o: "Atomicity, consistency, isolation, durability.", w: "Money, orders, anything that must not half-happen.",
      h: "Atomic: all or nothing. Consistent: rules always hold. Isolated: concurrent transactions don’t see each other’s partial work. Durable: once committed, it survives a crash.",
      t: "Strong guarantees cost throughput and are hard to keep across machines." },
    { id: "isolation-levels", n: "Isolation levels", s: 1, k: "Isolation (database systems)", o: "Read committed, repeatable read, serializable.", w: "Concurrent updates to the same data.",
      h: "Read committed prevents dirty reads; repeatable read also prevents non-repeatable reads; serializable behaves as if transactions ran one at a time, preventing phantoms and lost updates.",
      t: "Stronger levels prevent more anomalies but cause more blocking or aborted transactions.", r: [L.vlad, L.arpitIso, L.pgIso] },
    { id: "locking", n: "Optimistic vs pessimistic locking", s: 1, k: "Optimistic concurrency control", o: "Check a version on write vs lock the row first.", w: "Booking, inventory, counters.",
      h: "Optimistic: UPDATE … WHERE version = old; if no row changed, someone else won, so retry. Pessimistic: SELECT … FOR UPDATE holds a lock until commit.",
      t: "Optimistic suits low contention; pessimistic suits high contention but can deadlock and blocks others.", r: [L.arpitConc, L.vlad] },
    { id: "mvcc", n: "MVCC", k: "Multiversion concurrency control", o: "Readers see a snapshot and don’t block writers.", w: "Explaining how Postgres handles concurrency.",
      h: "Each write creates a new row version tagged with transaction IDs, and each transaction sees the versions valid at its snapshot. Old versions are cleaned up later (vacuum).",
      t: "Great read concurrency, but old versions take space and need cleanup.", r: [L.pgMvcc] }
  ]},
  { id: "indexing", n: "Indexes & storage engines", b: "How databases find and store data on disk.", c: [
    { id: "btree", n: "Index (B-tree)", s: 1, k: "B-tree", o: "A sorted structure that makes lookups and range queries fast.", w: "Any slow query.",
      h: "A balanced tree keeps keys in order across pages, so finding a key takes a few page reads and a range is a scan of neighbouring leaves.",
      t: "Every index speeds reads but slows writes and uses storage.", r: [L.luke, L.arpitBtree] },
    { id: "composite-index", n: "Composite index", o: "An index on several columns, used left to right.", w: "Queries that filter on two or more fields.",
      h: "An index on (country, city) helps WHERE country = ? and WHERE country = ? AND city = ?, but not WHERE city = ? on its own.",
      t: "Column order matters: equality filters first, range filters last.", r: [L.luke] },
    { id: "lsm-tree", n: "LSM tree", k: "Log-structured merge-tree", o: "Write-optimised storage: write to memory, flush and merge in the background.", w: "Very write-heavy workloads.",
      h: "Writes go to an in-memory table and a log, then are flushed as sorted files that background compaction merges (Cassandra, RocksDB). Bloom filters skip files during reads.",
      t: "Fast writes, but reads may check several files and compaction uses disk I/O." },
    { id: "wal", n: "Write-ahead log (WAL)", k: "Write-ahead logging", o: "Record a change in a log before applying it.", w: "Explaining how databases stay durable.",
      h: "The log is appended sequentially and flushed on commit; after a crash the database replays it. The same log feeds replication and CDC.",
      t: "Each commit waits for a disk flush; group commit batches them." }
  ]},
  { id: "replication", n: "Replication", b: "Copies of data for read scaling and surviving failures.", c: [
    { id: "leader-follower", n: "Leader-follower replication", s: 1, k: "Replication (computing)", o: "One leader takes writes and copies them to followers that serve reads.", w: "Read scaling and failover.",
      h: "The leader streams its log to followers. If the leader fails, a follower is promoted.",
      t: "Simple, but writes are limited to one node and failover can lose recent writes." },
    { id: "multi-leader", n: "Multi-leader and leaderless", k: "Multi-master replication", o: "Several nodes accept writes; conflicts must be resolved.", w: "Multi-region writes, high availability.",
      h: "Multi-leader: each region has a leader that syncs with the others. Leaderless (Dynamo-style): clients write to several replicas and use quorums.",
      t: "Higher write availability, but conflicting writes need a resolution rule.", r: [L.dynamo] },
    { id: "replication-lag", n: "Replication lag", s: 1, o: "Followers are behind the leader, so a read may return old data.", w: "“I just posted, why can’t I see it?”",
      h: "Asynchronous replication means followers apply changes a little later. Fix the visible symptom by reading a user’s own writes from the leader for a short time.",
      t: "Routing reads to the leader fixes staleness but adds load there." },
    { id: "sync-async", n: "Synchronous vs asynchronous replication", o: "Wait for followers before confirming a write, or don’t.", w: "The durability vs latency trade-off.",
      h: "Synchronous: the commit returns only after a follower has the data, so failover loses nothing. Asynchronous: the commit returns immediately. Semi-synchronous waits for one follower.",
      t: "Synchronous is safer but slower, and stalls if the follower is down." }
  ]},
  { id: "partitioning", n: "Partitioning", b: "Splitting data across machines when one is not enough.", c: [
    { id: "sharding", n: "Sharding", s: 1, k: "Shard (database architecture)", o: "Splitting data across machines by key.", w: "Data or write load too big for one machine.",
      h: "Hash partitioning spreads keys evenly; range partitioning keeps neighbouring keys together for range scans. A routing layer maps each key to its shard.",
      t: "Cross-shard queries and transactions get hard, so pick the shard key from the access pattern.", r: [L.azSharding] },
    { id: "hot-partition", n: "Hot partition", s: 1, o: "One shard gets far more traffic than the others.", w: "Uneven load after sharding.",
      h: "A celebrity account or viral item concentrates traffic on one key. Fix it by splitting the key with a suffix, caching it, or giving it a dedicated shard.",
      t: "Key splitting spreads writes but makes reads gather from several places." },
    { id: "resharding", n: "Resharding", o: "Moving data when shards are added or removed.", w: "Growth over time.",
      h: "Pre-split into many small logical partitions and move whole partitions between machines, instead of rehashing every key.",
      t: "Online moves need double writes or copy-then-switch, which is complex." },
    { id: "consistent-hashing", n: "Consistent hashing", s: 1, k: "Consistent hashing", o: "Keys and nodes sit on a ring; adding a node moves only a small share of keys.", w: "Distributed caches and sharded storage.",
      h: "Hash nodes and keys onto a ring; each key belongs to the next node clockwise. Virtual nodes give each server many points, so load evens out.",
      t: "Balances well with virtual nodes, but hot keys still need separate handling.", r: [L.chVid] }
  ]}
  ]},

{ id: "caching", n: "Caching", hue: 38, icon: "bolt",
  b: "Keeping hot data close so the database doesn’t answer every request.",
  r: [L.azCacheAside, L.bbg, L.primer],
  g: [
  { id: "cache-strategies", n: "Caching strategies", b: "When data enters the cache and when it reaches the database.", c: [
    { id: "cache-aside", n: "Cache-aside", s: 1, k: "Cache (computing)", o: "Check the cache; on a miss read the database and fill the cache.", w: "The default caching pattern.",
      h: "Reads try the cache first. Writes update the database and delete the cache entry, so the next read reloads it.",
      t: "Simple and resilient, but the first read after a change is slower and races can leave stale data briefly.", r: [L.azCacheAside] },
    { id: "write-through", n: "Write-through", s: 1, o: "Writes go to the cache and the database together.", w: "Reads must see fresh data right after a write.",
      h: "Every write updates both before returning, so the cache is always current for written keys.",
      t: "Slower writes, and the cache fills with data that may never be read." },
    { id: "write-back", n: "Write-back", o: "Writes go to the cache first and reach the database later.", w: "Very high write rates where losing a few writes is acceptable.",
      h: "The cache confirms immediately and flushes to the database in batches.",
      t: "Fast writes, but data is lost if the cache fails before flushing." },
    { id: "local-distributed", n: "Local vs distributed cache", o: "In-process memory vs a shared cache cluster.", w: "Several app instances need the same cached data.",
      h: "A local cache is fastest but each instance has its own copy; Redis or Memcached gives one shared copy over the network.",
      t: "Local caches can disagree across instances; distributed caches add a network hop." }
  ]},
  { id: "freshness", n: "Freshness & eviction", b: "Deciding what stays in the cache and for how long.", c: [
    { id: "ttl", n: "TTL (time to live)", s: 1, k: "Time to live", o: "An entry expires automatically after a set time.", w: "Data that may be slightly stale.",
      h: "Each entry carries an expiry; after it, the next read reloads from the source. Add random jitter so entries don’t all expire together.",
      t: "Short TTLs mean fresher data but more database load." },
    { id: "eviction", n: "Eviction (LRU, LFU)", s: 1, k: "Cache replacement policies", o: "What to remove when the cache is full.", w: "Sizing the cache.",
      h: "LRU removes the least recently used entry; LFU removes the least frequently used. Most caches approximate these cheaply.",
      t: "LRU suits recency-driven traffic; LFU resists one-off scans pushing out popular items." },
    { id: "invalidation", n: "Cache invalidation", s: 1, k: "Cache invalidation", o: "Removing or updating cached data when the source changes.", w: "Any cache of data that changes.",
      h: "Delete on write, expire with TTLs, or listen to change events (CDC) and evict the affected keys.",
      t: "Event-driven invalidation is fresher but has more moving parts; TTLs are simple but stale for a while." },
    { id: "negative-caching", n: "Negative caching", o: "Caching “not found” results.", w: "Lookups for things that often don’t exist.",
      h: "Store a short-lived marker for missing keys so repeated misses don’t reach the database.",
      t: "A newly created item can look missing until the marker expires." }
  ]},
  { id: "cache-failures", n: "Failure modes & metrics", b: "What goes wrong with caches under load, and how to tell it’s working.", c: [
    { id: "cache-stampede", n: "Cache stampede", s: 1, k: "Cache stampede", o: "A popular entry expires and thousands of requests hit the database at once.", w: "Hot keys.",
      h: "Let one request rebuild the entry while others wait or get the old value (request coalescing), or refresh popular keys before they expire.",
      t: "Serving the old value briefly is usually better than overloading the database." },
    { id: "hot-key", n: "Hot key", o: "One cache key receives a huge share of traffic.", w: "Celebrity profiles, flash sales.",
      h: "Keep a copy in each app server’s local cache, or replicate the key across cache nodes using suffixes.",
      t: "Extra copies make invalidation harder." },
    { id: "hit-rate", n: "Cache hit rate", o: "Share of requests served from the cache.", w: "Proving the cache is worth having.",
      h: "Hit rate = hits ÷ (hits + misses). Watch it alongside eviction rate and memory use.",
      t: "Chasing a higher hit rate with long TTLs trades away freshness." },
    { id: "request-coalescing", n: "Request coalescing", s: 1, o: "Many identical in-flight requests share one execution (single-flight).", w: "Cache stampedes and duplicate work.",
      h: "Keep a map of keys currently being computed; later requests for the same key wait for that result instead of starting another.",
      t: "Waiters share the first request’s failure, so retry carefully." }
  ]}
  ]},

{ id: "distributed", n: "Distributed Systems", hue: 310, icon: "nodes",
  b: "Consistency, consensus and coordination when machines fail and networks split.",
  r: [L.kleppmann, L.jepsen, L.raftViz],
  g: [
  { id: "consistency", n: "Consistency models", b: "What a read is allowed to return after a write.", c: [
    { id: "cap", n: "CAP theorem", s: 1, k: "CAP theorem", o: "During a network partition, choose consistency or availability.", w: "Explaining behaviour when nodes can’t talk.",
      h: "Partitions will happen, so the real choice is CP (refuse requests to stay correct) or AP (keep answering, possibly stale, and reconcile later).",
      t: "Choose per feature: balances are CP, likes are AP.", r: [L.jepsen] },
    { id: "pacelc", n: "PACELC", k: "PACELC design principle", o: "Even without a partition, latency trades against consistency.", w: "Explaining why strong consistency is slower.",
      h: "If Partition: Availability or Consistency; Else: Latency or Consistency. Coordinating replicas on every write costs round trips.",
      t: "Lower latency means accepting weaker consistency." },
    { id: "strong-consistency", n: "Strong consistency", s: 1, k: "Linearizability", o: "Every read sees the latest write, as if there were one copy (linearisability).", w: "Balances, inventory, locks.",
      h: "Achieved with a single leader per item or with consensus; reads go through the leader or a quorum.",
      t: "Higher latency and lower availability during failures.", r: [L.jepsen] },
    { id: "eventual-consistency", n: "Eventual consistency", s: 1, k: "Eventual consistency", o: "Copies converge if writes stop; reads may be stale for a while.", w: "Likes, feeds, view counts.",
      h: "Writes propagate asynchronously; conflicts resolve by rules such as last-write-wins or merging (CRDTs).",
      t: "Fast and available, but the application must tolerate stale reads." },
    { id: "read-your-writes", n: "Read-your-writes", o: "A user always sees their own updates.", w: "Profile edits, posts.",
      h: "Route a user’s reads to the leader for a while after they write, or remember the version they wrote and wait until a replica has it.",
      t: "Extra routing logic and load on the leader." },
    { id: "causal-consistency", n: "Causal consistency", k: "Causal consistency", o: "If one event caused another, everyone sees them in that order.", w: "Comment replies, chat.",
      h: "Track dependencies between writes (version vectors) and never show an event before the events it depends on.",
      t: "Stronger than eventual and cheaper than linearisable, but needs metadata on every write." },
    { id: "quorum", n: "Quorum (R + W > N)", s: 1, k: "Quorum (distributed computing)", o: "Read and write overlaps that guarantee seeing the latest write.", w: "Tuning consistency in leaderless stores.",
      h: "With N replicas, writes wait for W acknowledgements and reads ask R nodes. If R + W > N, every read overlaps the latest write. N = 3, W = 2, R = 2 is common.",
      t: "Bigger quorums are more consistent but slower and less available.", r: [L.dynamo] }

  { id: "coordination", n: "Consensus & coordination", b: "Getting machines to agree on one leader, one owner, one order.", c: [

      h: "In Raft, a leader is elected by majority vote for a term, appends entries to followers, and commits an entry once a majority has it. A 5-node cluster survives 2 failures.",
      t: "Every write needs a majority round trip, so use consensus for metadata, not bulk data.", r: [L.raftViz, L.raft, L.kleppmann] },
    { id: "leader-election", n: "Leader election", s: 1, k: "Leader election", o: "Choosing one node to coordinate.", w: "Schedulers, primary databases.",
      h: "Usually done through a consensus service or a lease in etcd or ZooKeeper; the leader must keep renewing it.",
      t: "Two leaders can briefly coexist, so pair it with fencing tokens.", r: [L.awsLeader, L.azLeader] },
    { id: "split-brain", n: "Split brain", s: 1, k: "Split-brain (computing)", o: "Two nodes both think they’re the leader.", w: "Network partitions.",
      h: "Prevent it by requiring a majority to elect a leader, so only one side of a partition can have one, and by fencing the old leader.",
      t: "Requiring a majority means the minority side stops serving." },
    { id: "lease", n: "Lease", s: 1, k: "Lease (computer science)", o: "Time-limited ownership that must be renewed.", w: "Locks, leaders, task ownership.",
      h: "The holder renews before expiry; if it crashes, the lease runs out and someone else can take over.",
      t: "Short leases recover faster but risk false expiry during pauses such as garbage collection." },
    { id: "fencing-token", n: "Fencing token", s: 1, o: "An increasing number issued with each lease; storage rejects older numbers.", w: "Stopping a stale owner after its lease expired.",
      h: "Each new lease gets a higher token. The storage remembers the highest token seen and rejects writes that carry a lower one.",
      t: "The protected storage must check the token, which needs support on that side.", r: [L.kLock] },
    { id: "distributed-lock", n: "Distributed lock", s: 1, k: "Distributed lock manager", o: "A lock shared across machines, usually built on a lease.", w: "Only one worker may process an item.",
      h: "Take a lease-based lock in etcd, ZooKeeper or Redis together with a fencing token, then release it or let it expire.",
      t: "Locks reduce throughput; idempotent designs or partitioning work by key are often better.", r: [L.kLock] }
  ]},
  { id: "time-ordering", n: "Time & ordering", b: "Why wall clocks can’t order events across machines.", c: [
    { id: "clock-skew", n: "Clock skew", k: "Clock skew", o: "Machines’ clocks disagree.", w: "“Last write wins” goes wrong.",
      h: "Clocks drift and NTP corrections jump, so two events milliseconds apart can be ordered wrongly across machines.",
      t: "Use logical clocks or a single sequencer when order matters." },
    { id: "logical-clocks", n: "Logical clocks", k: "Vector clock", o: "Ordering events with counters instead of wall-clock time (Lamport, vector).", w: "Detecting concurrent updates.",

  { id: "delivery", n: "Delivery & transactions", b: "Making operations safe to repeat and atomic across services.", c: [

      h: "At-most-once may lose messages; at-least-once may duplicate them; exactly-once in practice means at-least-once delivery plus idempotent processing.",
      t: "The stronger the guarantee, the more coordination it needs.", r: [L.eos] },
    { id: "idempotency-key", n: "Idempotency key", s: 1, o: "A unique ID per operation, so a repeat is recognised and ignored.", w: "Payments, retries, webhooks.",
      h: "The client generates the key; the server stores key → result in the same transaction as the effect and returns the stored result on a repeat.",
      t: "Keys must be kept long enough to cover every retry.", r: [L.stripeIdem, L.awsIdem] },
    { id: "two-phase-commit", n: "Two-phase commit (2PC)", k: "Two-phase commit protocol", o: "Prepare everywhere, then commit everywhere.", w: "Explaining why sagas are preferred across services.",
      h: "A coordinator asks all participants to prepare; if all say yes, it tells them to commit. Participants hold locks in between.",

  ]},

{ id: "messaging", n: "Messaging & Events", hue: 150, icon: "queue",
  b: "Queues, logs and event-driven patterns for async work between services.",
  r: [L.kafka, L.msIndex, L.msPatVid],
  g: [
  { id: "brokers", n: "Brokers & topics", b: "How messages are stored, ordered and shared between consumers.", c: [
    { id: "queue-vs-log", n: "Message queue vs log", s: 1, k: "Message queue", o: "A queue deletes a message once handled; a log keeps it for replay.", w: "Choosing a broker.",
      h: "Queues (RabbitMQ, SQS) hand each message to one consumer and remove it. Logs (Kafka) append messages and let each consumer group read at its own offset, replaying when needed.",
      t: "Logs enable replay and many readers; queues make per-message acknowledgement and routing simpler.", r: [L.kafka] },
    { id: "pub-sub", n: "Pub/sub", s: 1, k: "Publish–subscribe pattern", o: "Publishers send to a topic; every subscriber gets a copy.", w: "Fan-out of events to several services.",
      h: "Producers don’t know who consumes; each subscription receives every message independently.",
      t: "Loose coupling, but it’s harder to trace who depends on an event.", r: [L.azPubSub] },
    { id: "partition-ordering", n: "Partition and ordering", s: 1, o: "Kafka keeps order only within a partition.", w: "“All events for one account must stay in order.”",
      h: "The message key is hashed to choose the partition, so all events with the same key land in the same partition, in order.",
      t: "More partitions mean more parallelism, but there’s no ordering across keys.", r: [L.kafka] },
    { id: "consumer-group", n: "Consumer group", s: 1, o: "Consumers that share a topic’s partitions.", w: "Scaling consumers.",
      h: "Each partition is read by exactly one consumer in the group; more consumers than partitions leaves some idle.",
      t: "Parallelism is capped by the partition count, so choose it with growth in mind." },
    { id: "offset", n: "Offset", o: "A consumer’s position in the log.", w: "Resuming after a crash.",
      h: "Committing the offset after processing gives at-least-once; committing before processing gives at-most-once.",
      t: "Commit after processing and make processing idempotent." },
    { id: "rebalance", n: "Rebalance", o: "Partitions are reassigned when consumers join or leave.", w: "Consumer crashes and scaling events.",
      h: "The group coordinator redistributes partitions; consumers stop, commit offsets and resume on their new assignments. Cooperative rebalancing moves only the affected partitions.",
      t: "Frequent rebalances pause processing, so keep consumer sessions stable." }
  ]},
  { id: "msg-failures", n: "Failure handling", b: "Keeping a pipeline flowing when some messages or consumers fail.", c: [
    { id: "dead-letter-queue", n: "Dead-letter queue (DLQ)", s: 1, k: "Dead letter queue", o: "Where messages go after repeated failures.", w: "Bad data, poison messages.",
      h: "After N retries, the consumer moves the message to a DLQ with error details and continues; operators inspect and replay it later.",
      t: "Keeps the pipeline moving, but someone must own and empty the DLQ." },
    { id: "poison-message", n: "Poison message", o: "A message that fails every time it’s processed.", w: "Explaining why a DLQ exists.",
      h: "Without a retry limit, one bad message blocks its partition forever.",
      t: "Moving it aside breaks strict ordering for that key, so decide which matters more." },
    { id: "backpressure", n: "Backpressure", s: 1, o: "Slowing producers when consumers can’t keep up.", w: "Spikes, slow downstream services.",
      h: "Bounded queues reject or delay new work, pull-based consumers take only what they can handle, and producers slow down on those signals.",
      t: "Protects the system, but pushes delay or errors back to callers.", r: [L.azQbll] }
  ]},
  { id: "event-patterns", n: "Event-driven patterns", b: "The patterns that make multi-service workflows reliable.", c: [
    { id: "async-jobs", n: "Async job queue and workers", s: 1, o: "Accept a request, return a job ID, process in the background.", w: "Anything taking seconds or minutes.",
      h: "The API writes the job to a queue and returns 202 with a job ID; workers process it and update its status, which the client polls or receives by push.",
      t: "Better responsiveness and scaling, but the client must handle a pending state.", r: [L.azCompeting] },
    { id: "event-driven", n: "Event-driven architecture", s: 1, k: "Event-driven architecture", o: "Services react to events instead of calling each other.", w: "Loose coupling between teams.",
      h: "A service publishes facts such as OrderPlaced; other services subscribe and act independently.",
      t: "Easier to extend, harder to follow end to end, so invest in tracing." },
    { id: "outbox", n: "Transactional outbox", s: 1, o: "Write the data and an outbox row in one transaction; publish later.", w: "Updating a database and publishing an event reliably.",
      h: "Because the event row commits with the data, it can’t be lost. A relay or CDC reads the outbox and publishes to the broker, retrying until it succeeds.",
      t: "Events arrive at least once and slightly delayed, so consumers must be idempotent.", r: [L.msOutbox, L.dualWrite, L.dgOutbox] },
    { id: "cdc", n: "Change data capture (CDC)", s: 1, k: "Change data capture", o: "Stream a database’s changes from its log.", w: "Syncing search indexes, caches and warehouses.",
      h: "A connector such as Debezium tails the database’s replication log and publishes every insert, update and delete as an event.",
      t: "No dual writes, but events mirror table structure, which couples consumers to the schema.", r: [L.debezium] },
    { id: "saga", n: "Saga", s: 1, o: "A multi-step transaction across services, with an undo step for each.", w: "Checkout, payments, booking.",
      h: "Each step commits locally; if a later step fails, earlier steps are undone by compensating actions. Choreography uses events; orchestration uses a central coordinator.",
      t: "No distributed locks, but intermediate states are visible and compensations must be designed carefully.", r: [L.msSaga, L.azSaga, L.sagaTalk] },
    { id: "event-sourcing", n: "Event sourcing", o: "Store every change as an event; rebuild state from the events.", w: "Ledgers and audit trails.",
      h: "The event log is the source of truth; current state is a projection, with snapshots to speed up rebuilding.",
      t: "Full history and audit, but schema changes and queries are harder.", r: [L.fowlerES, L.azES] },
    { id: "cqrs", n: "CQRS", s: 1, o: "Separate models for writes and reads.", w: "Read patterns differ a lot from writes.",
      h: "Commands update a write model; events update one or more read models shaped for queries.",
      t: "Read models are eventually consistent and there’s more to run.", r: [L.fowlerCqrs, L.azCqrs] },
    { id: "fan-out", n: "Fan-out", o: "One event triggers many deliveries.", w: "Notifications and feeds.",
      h: "A single message is copied to many queues or recipients, usually through pub/sub plus worker pools.",
      t: "One event can create a huge load, so batch and rate-limit the fan-out." }
  ]}
  ]},

{ id: "reliability", n: "Reliability & Operations", hue: 352, icon: "shield",

    { id: "reconciliation", n: "Reconciliation job", o: "A periodic job that compares two systems and fixes differences.", w: "Catching what events or retries missed.",

  { id: "resilience", n: "Resilience patterns", b: "Stopping one slow or failing dependency from spreading.", c: [

  { id: "overload", n: "Overload protection", b: "Staying up when demand exceeds capacity.", c: [

    { id: "graceful-degradation", n: "Graceful degradation", s: 1, k: "Fault tolerance", o: "Keep the core working when a non-essential part fails.", w: "“Without recommendations, the page still loads.”",

  { id: "observability", n: "Observability & SLOs", b: "Defining reliability and seeing what production is doing.", c: [

    { id: "error-budget", n: "Error budget", s: 1, o: "Allowed unreliability: 99.9% means about 43 minutes a month.", w: "Balancing releases against stability.",
      h: "While budget remains, ship freely; when it’s spent, freeze risky changes and work on reliability.",
